[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "forgeai"
version = "0.1.0"
description = "Autonomous agent factory that builds, tests, diagnoses, and improves RAG/tool agents."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "langgraph>=0.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
forge = "forgeai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["forgeai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

